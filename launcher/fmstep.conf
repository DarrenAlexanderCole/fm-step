# FM-STEP supervisor settings. Durations use Go syntax: 500ms, 3s, 10m.
# The launcher appends app_path and run_dir; do not set them here.

# Firmware check: "cached" (default) hashes the stock program once and then
# re-checks only if its size, times or inode change; "full" hashes every launch
# (~2.4 s slower).
# firmware_check = full

# Recovery policy
ready_timeout = 20s            # app must report ready within this time
heartbeat_timeout = 3s         # max silence from the app before it is killed
healthy_after = 10s            # ready + heartbeats this long = successful launch
max_restarts = 1               # automatic restarts per session after a runtime crash
restart_window = 10m           # a second crash inside this window is never restarted
max_consecutive_failures = 2   # failed launches before custom startup is disabled

# Stock service handling
stock_unit = ac50.service
stock_exe = /usr/bin/MPC Sample
stock_stop_timeout = 15s
stock_start_timeout = 30s
stock_stable = 5s              # stock PID must stay unchanged this long to count as restored
device_free_timeout = 5s

# Recovery screen (shown only if the stock software cannot be restarted)
recovery_ui = panel
reboot_prompt_timeout = 60s
panel_init_sysex = 1
